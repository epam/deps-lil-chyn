[tool.poetry]
name = "deps-lil-chyn"
version = "0.1.0"
description = "Extractor package that could be used in extraction plugins"
authors = []

[tool.poetry.dependencies]
python = ">=3.12.0,<4.0"
pydantic = "^2.11.7"
pydantic-settings = "^2.10.1"
click = "~8.1.3"
opencv-python-headless = "~4.8.1.78"
dependency-injector = "^4.48.0"
requests = "^2.28.1"
Pillow = "~11"
opencv-python = "4.8.1.78"
"pdfminer.six" = "^20220524"
pypdfium2 = "^2.11.0"
numpy = "1.*"

deps-message-flow = { path = "./vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq"], develop = true }
deps-unified-data = { path = "./vendors/deps-unified-data", develop = true }
deps-observability-instrumentation = { path = "./vendors/deps-observability-instrumentation", develop = true }
deps-object-storage = { path = "./vendors/deps-object-storage", develop = true }

openpyxl = "^3.1.2"
xls2xlsx = "^0.2.0"
python-docx = "~0.8.11"
mail-parser = "3.14.0"
rtfparse = "0.7.8"

[tool.poetry.dev-dependencies]
flake8 = "^6.1.0"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
mypy = "^1.6.1"
coverage = "^7.3.2"
pytest-factoryboy = "^2.6.0"
mock = "^4.0.3"
faker-enum = "^0.0.2"
pytest-mock = "^3.11.1"
types-requests = "^2.25.6"

ipdb = "^0.13.13"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
markers = [
    "doc",
    "docx",
    "excel",
    "csv",
]
